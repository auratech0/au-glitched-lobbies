name: Build AUGLMod

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "6.0.x"

      - name: Verify game libraries
        shell: pwsh
        run: |
          $required = @(
            "0Harmony.dll",
            "Assembly-CSharp.dll",
            "BepInEx.Core.dll",
            "BepInEx.Unity.IL2CPP.dll",
            "Hazel.dll",
            "Il2CppInterop.Common.dll",
            "Il2CppInterop.Generator.dll",
            "Il2CppInterop.Runtime.dll",
            "Il2CppSystem.dll",
            "Il2Cppmscorlib.dll",
            "UnityEngine.dll",
            "UnityEngine.CoreModule.dll",
            "UnityEngine.ImageConversionModule.dll",
            "UnityEngine.IMGUIModule.dll",
            "UnityEngine.InputLegacyModule.dll",
            "UnityEngine.InputModule.dll",
            "UnityEngine.TextRenderingModule.dll"
          )

          $missing = @()

          foreach ($dll in $required) {
            $path = Join-Path "libs" $dll

            if (!(Test-Path $path)) {
              $missing += $path
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Missing required libraries:`n$($missing -join "`n")"
            exit 1
          }

          Write-Host "All required libraries are present."

      - name: Restore
        run: dotnet restore AUGLMod.csproj

      - name: Build
        run: dotnet build AUGLMod.csproj --configuration Release --no-restore

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/BepInEx/plugins/AUGL | Out-Null

          Copy-Item `
            "bin/Release/net6.0/AUGLMod.dll" `
            "package/BepInEx/plugins/AUGL/AUGLMod.dll"

          if (Test-Path "README.md") {
            Copy-Item "README.md" "package/README.md"
          }

          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" "package/LICENSE"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUGLMod
          path: package/
          if-no-files-found: error
