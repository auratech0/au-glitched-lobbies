name: Build AUGLMod

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "6.0.x"

      - name: Download dependencies
        shell: pwsh
        run: |
          $url = "https://files.skybuilder1717.ru/auglmod.zip"
          $zip = "$env:RUNNER_TEMP\auglmod.zip"

          Write-Host "Downloading dependencies..."
          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip

          if (!(Test-Path $zip)) {
            throw "Failed to download dependencies."
          }

          Write-Host "Extracting dependencies..."

          if (Test-Path "libs") {
            Remove-Item "libs" -Recurse -Force
          }

          Expand-Archive `
            -Path $zip `
            -DestinationPath "." `
            -Force

      - name: Check dependencies
        shell: pwsh
        run: |
          $required = @(
            "0Harmony.dll",
            "Assembly-CSharp.dll",
            "BepInEx.Core.dll",
            "BepInEx.Unity.IL2CPP.dll",
            "Hazel.dll",
            "Il2CppInterop.Common.dll",
            "Il2CppInterop.Generator.dll",
            "Il2CppInterop.Runtime.dll",
            "Il2CppSystem.dll",
            "Il2Cppmscorlib.dll",
            "UnityEngine.dll",
            "UnityEngine.CoreModule.dll",
            "UnityEngine.ImageConversionModule.dll",
            "UnityEngine.IMGUIModule.dll",
            "UnityEngine.InputLegacyModule.dll",
            "UnityEngine.InputModule.dll",
            "UnityEngine.TextRenderingModule.dll"
          )

          $missing = @()

          foreach ($dll in $required) {
            $path = "libs\$dll"

            if (!(Test-Path $path)) {
              $missing += $dll
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host "Missing DLLs:"
            $missing | ForEach-Object {
              Write-Host "  - $_"
            }

            exit 1
          }

          Write-Host "All dependencies are present."

      - name: Restore
        run: dotnet restore AUGLMod.csproj

      - name: Build
        run: dotnet build AUGLMod.csproj --configuration Release --no-restore

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "artifact/BepInEx/plugins/AUGL" | Out-Null

          Copy-Item `
            "bin/Release/net6.0/AUGLMod.dll" `
            "artifact/BepInEx/plugins/AUGL/AUGLMod.dll"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUGLMod
          path: artifact/
          if-no-files-found: error